hypothesis (B*07:02 exception) — H4 REFUTED, corrected mechanism:
  H4 (proline under-use) was REFUTED. Pan-full B*07:02 non-canonical misses @0.9 are
  1/5 P2=P-present; 4/5 are P2-absent (aliphatic V/I). The pan model OVER-commits to
  B*07:02's distinctive P2-proline anchor, trading recall for precision (over-anchoring,
  opposite of dilution). Missed binders are legitimate B7-family peptides with
  aliphatic P2.

